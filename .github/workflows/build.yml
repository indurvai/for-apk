name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env.example
        run: touch .env.example
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.3.1' }
      - name: Create debug keystore
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: NotifyTrace-APK, path: app/build/outputs/apk/debug/*.apk }
      - name: Publish to Releases
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/debug/*.apk NotifyTrace.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest NotifyTrace.apk --title "NotifyTrace latest" --target "${{ github.sha }}"
